[package]
name = "knowledge-app"
description = "Daily learning popup + local-LLM repo Q&A for senior/staff/principal engineers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "knowledge-app"

[lib]
name = "knowledge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
knowledge-core = { path = "../crates/core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"

# macOS-only: NSPanel overlay support. Pin to the Tauri v2 branch.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder"] }
